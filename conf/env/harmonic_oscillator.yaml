# Marginally-stable harmonic oscillator -- the markovian (no-delay) ODE cell, H1-negative control:
# dx/dt = [[0,-1],[1,0]] x + [[0],[1]] u, no delay (A1 = 0). Eigenvalues +/- i (purely imaginary), so
# under zero control the state OSCILLATES with bounded amplitude rather than diverging. As a
# no-delay plant the optimal value depends on x(t) only, so history is irrelevant and H1 must FAIL
# here: this cell is the falsification control against which the delayed cells are read.
# It is the A1 = 0 special case of the general family dx/dt = A x + B u + A1 x(t - delay).
# Controllable: [B, AB] = [[0,-1],[1,0]] has rank 2.
environment_params:
  _target_: src.envs.env_rk_jax.JAXDDEEnv
  A:
    _target_: numpy.array
    object: [[0.0, -1.0], [1.0, 0.0]]
    dtype: float64
  B:
    _target_: numpy.array
    object: [[0.0], [1.0]]
    dtype: float64
  A1:
    _target_: numpy.zeros
    _args_:
      - [2, 2]
    dtype: float64
  delay:
    _target_: numpy.zeros
    _args_:
      - 2
    dtype: float64
  Q:
    _target_: numpy.eye
    N: 2
  # R = 0.1, uniform with the delayed cells (all 0.1), so R sets the magnitude of any H1 effect,
  # never its direction. On this markovian cell history is useless whatever R is.
  R:
    _target_: numpy.array
    object: [[0.1]]
    dtype: float64
  step_size: 0.05
  resolution: 4
