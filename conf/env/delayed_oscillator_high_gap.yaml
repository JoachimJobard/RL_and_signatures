# High-gap delayed oscillator (linear DDE) — a STRONG, learnable H1 test.
#
# dx/dt = A x + A1 x(t-tau) + B u, with A = [[0,1],[-1,-0.3]] (lightly-damped
# oscillator, omega=1, zeta=0.15) and A1 = [[0,0],[-6,-6]] (strong delayed
# POSITION + VELOCITY feedback into the acceleration). tau=0.2, step_size=0.05
# -> K=4 delay taps.
#
# Design rationale (see documents/methodology/experimental_design.md). The first
# learnable cell (delayed_velocity_oscillator) had only an ~18% markovian-oracle gap.
# A parameter search (max gap subject to open-loop boundedness; recorded in the
# project memory) found bounded plants up to ~58% gap. This env sits near that
# frontier: ~54.5% gap (markovian_oracle_gap) while remaining
#   - open-loop BOUNDED (zero-control max|x| ~2.9 from x0=[1,1]) -> finite TD targets,
#     so the critic-only value-gradient agent can learn it;
#   - the delay-ignoring (ordinary) LQR stays STABLE but ~54.5% above the delayed-LQR
#     oracle -> the gap is genuine sub-optimality, not divergence, so the Markovian
#     representation is far from optimal WITHOUT making the closed loop blow up;
#   - the delayed-LQR oracle stabilises it (closed-loop spectral radius ~0.94 < 1).
# This is therefore a much stronger H1 test than delayed_velocity_oscillator while
# staying in the learnable regime.
environment_params:
  _target_: src.envs.env_rk_jax.JAXDDEEnv
  A:
    _target_: numpy.array
    object: [[0.0, 1.0], [-1.0, -0.3]]
    dtype: float64
  B:
    _target_: numpy.array
    object: [[0.0], [1.0]]
    dtype: float64
  A1:
    _target_: numpy.array
    object: [[0.0, 0.0], [-6.0, -6.0]]
    dtype: float64
  delay:
    _target_: numpy.array
    object: [0.2, 0.2]
    dtype: float64
  Q:
    _target_: numpy.eye
    N: 2
  R:
    _target_: numpy.array
    object: [[0.1]]
    dtype: float64
  step_size: 0.05
  resolution: 4
