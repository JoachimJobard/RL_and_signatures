# Markovian double-integrator (H1 NEGATIVE control): dx/dt = [[0,1],[0,0]] x + [[0],[1]] u, no delay.
# History is irrelevant (the optimal value depends on x(t) only) => H1 must FAIL here. Matches the
# oracle-referenced harness cell 'markovian' in run/study/h1h2_evaluation.py so the RL and oracle
# results are on the identical plant.
environment_params:
  _target_: src.envs.env_rk_jax.JAXDDEEnv
  A:
    _target_: numpy.array
    object: [[0.0, 1.0], [0.0, 0.0]]
    dtype: float64
  B:
    _target_: numpy.array
    object: [[0.0], [1.0]]
    dtype: float64
  A1:
    _target_: numpy.zeros
    _args_:
      - [2, 2]
    dtype: float64
  delay:
    _target_: numpy.zeros
    _args_:
      - 2
    dtype: float64
  Q:
    _target_: numpy.eye
    N: 2
  R:
    _target_: numpy.array
    object: [[1.0]]
    dtype: float64
  step_size: 0.1
  resolution: 4
