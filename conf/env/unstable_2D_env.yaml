# Unstable 2D linear system (no delay): dx/dt = A x + B u, A = [[1,2],[1,0]].
# Ported from the removed src.env.Environment API to JAXDDEEnv. The cost matrices
# Q, R were added during the migration (defaults matching delay_jax.yaml); adjust
# them to the intended control objective if this environment is used.
environment_params:
  _target_: src.envs.env_rk_jax.JAXDDEEnv
  A:
    _target_: numpy.array
    object: [[1, 2], [1, 0]]
    dtype: float64
  B:
    _target_: numpy.array
    object: [[0], [1]]
    dtype: float64
  A1:
    _target_: numpy.zeros
    _args_:
      - [2, 2]
    dtype: float64
  delay:
    _target_: numpy.zeros
    _args_:
      - 2
    dtype: float64
  Q:
    _target_: numpy.eye
    N: 2
  R:
    _target_: numpy.array
    object: [[0.1]]
    dtype: float64
  step_size: 0.01
  resolution: 10
