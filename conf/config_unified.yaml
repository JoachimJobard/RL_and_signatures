# =============================================================================
# Unified Configuration for Continuous-Time RL Experiments
# =============================================================================
# Usage:
#   python main.py                           # Default: actor_critic agent + delay env
#   python main.py agent=base_jax            # Use vanilla CTAC
#   python main.py agent=csac                # Use Soft Actor-Critic
#   python main.py agent=value_gradient      # Use Value Gradient
#   python main.py env=mackey_glass          # Different environment
#   python main.py agent.depth=4 agent.training_params.n_episodes=5000

defaults:
  - agent: actor_critic       # Options: actor_critic, base_jax, csac, value_gradient
  - env: delay_jax          # Options: delay_jax, mackey_glass, stable_2d, etc.
  - launcher: local         # Options: local, slurm
  - _self_

# =============================================================================
# Global Settings
# =============================================================================
seed: 42                      # single master seed; per-role seeds are derived from it

debug: false                  # true: prepend _debug_ to the run dir and bypass the smoke-test guard
replot: null                  # path to an existing run dir: rebuild figures from saved data and exit
run_tag: null                 # per-variant folder label (ablation/sweep tasks); defaults to <agent>_<env>
experiment_group: null        # shared parent sub-folder grouping all tasks of one ablation/sweep

# =============================================================================
# Evaluation Settings
# =============================================================================
eval:
  x0_test: [1.0, 1.0]         # Initial state for evaluation (overridden by env if needed)
  T_sim: 15.0                 # Simulation time for evaluation
  n_eval_trajectories: 5      # Number of different initial conditions to test
  log_interval: 5            # Wandb logging subsampling
  snapshot_interval: 100      # Evaluate trajectory every N episodes (wandb slider)
  burning_steps: 0
  # OPT-IN discount-truncation horizon (results-CHANGING; OFF by default). When set to a
  # discount tolerance eps in (0,1), the explicit horizon (agent.training.max_time and eval.T_sim)
  # is REPLACED by T = (1/gamma) ln(1/eps), N = ceil(T/dt): the time after which the discounted
  # tail of the infinite-horizon objective J = int_0^inf e^{-gamma s} c(s) ds is bounded by
  # (c_max/gamma) e^{-gamma T} = (c_max/gamma) eps. Larger eps => shorter T (faster, coarser);
  # smaller eps => longer T (slower, tighter). Requires a discounted objective (gamma>0). The same
  # eps (hence the same T) applies to every variant of a cell -- never set it per variant. Leave
  # null to keep the explicit, pre-registered T_sim/max_time unchanged (the default).
  discount_tolerance: null

# =============================================================================
# Hydra Configuration
# =============================================================================
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  output_subdir: null

# =============================================================================
# Weights & Biases Configuration
# =============================================================================
wandb:
  project_name: RL_and_Signatures_new_runs
  entity: null
  mode: online                # Options: online, offline, disabled
  name: run_${now:%H%M%S}
  group: experiments

# =============================================================================
# Checkpointing & Data Export
# =============================================================================
save_checkpoint: true
checkpoint_path: ${hydra:run.dir}/checkpoint_agent.pkl
metrics_path: ${hydra:run.dir}/metrics.pkl

save_eval_data: true
eval_data_dir: eval_outputs
eval_data_name: ${wandb.name}
