# ContinuousValueGradient Agent Configuration
# Value Gradient method (no actor network, action derived from V gradient)

_target_: src.agents.value_gradient_jax.ContinuousValueGradient

# =============================================================================
# Training
# =============================================================================
training:
  n_episodes: 500
  max_time: 15.0
  critic_lr: 1e-3
  scale: 1.0
  clip_action: null  # null/<=0: no action clipping (default preference); else bound |u|
  clip_gradient: null  # null/<=0: no gradient clipping (default); else global-norm bound on the critic gradient
  divergence_threshold: 100.0
  eval_interval: 20
  tau_polyak: 0.01
  log_interval: 10
  init_log_interval: 50
  memory_clear_interval: 1000

# =============================================================================
# Discount
# =============================================================================
discount:
  discounted: false
  # Restored to the normal value. 1.0 is the DiscountConfig default (src/configs.py:54) and Doya's
  # own setting (2000, Figure 2 caption: tau = 1.0), and is what every other agent config carries
  # (1.0 or 1.2). Only this file and conf/agent/csac.yaml held 100.0 -- a hundredfold outlier, and
  # the sole remaining hundredfold gap against conf/agent/signatures.yaml (1.0), which would have
  # meant the two learners weighing horizons of order 100 s and 1 s on episodes lasting 15-60 s.
  #
  # The change is INERT and that was verified, not assumed: tau enters only the discounted branch
  # of the temporal-difference residual (value_gradient_jax.py:264, :659; signatures_jax.py:580,
  # :610, :736), and discount.discounted is false; its one unconditional use, the LSTD accumulator
  # at value_gradient_jax.py:309, is unreachable because algorithm.lstd resolves to False. The
  # value gradient is therefore bit-unchanged, so the existing five-seed H1/H2 results stand.
  #
  # This is a latent foot-gun disarmed, not a live defect fixed: enabling discount.discounted or
  # algorithm.lstd would have armed the hundredfold gap silently.
  tau: 1.0
  V_target: 0.0
  V_bad: -10.0

# =============================================================================
# Noise
# =============================================================================
noise:
  sigma: 0.1
  schedule: constant
  decay: false
  smooth: true
  length_scale: 0.002

# =============================================================================
# Signature
# =============================================================================
signature:
  kind: signature       # representation: signature | raw_history | markovian
  depth: 2              # signature truncation depth (kind=signature)
  degree: 2             # polynomial degree (kind=raw_history / markovian)
  window_size: 40
  time_augmentation: true
  origin_augmentation: true
  bias: false
  force_signature_window: false  # if true, override window_size to match max delay

# =============================================================================
# Network
# =============================================================================
network:
  std_init: 0.01
  hidden_dims: []
  normalize_layers: false

# =============================================================================
# Algorithm
# =============================================================================
algorithm:
  # The DDE initial condition is the initial PATH phi on [-tau, 0]: loaded directly
  # into the signature window from the env history buffer (constant x0 by default, or
  # a history_function), with control starting at t=0. There is NO zero-control
  # burn-in / preheat (it would overwrite phi with an uncontrolled-evolution path).
  fix_initial_state: true   # fix phi = constant x0 across episodes (vs sampling it)
  # Critic solver. Default is semi-gradient TD (SGD on the TD loss). LSTD solves the
  # linear-in-Phi critic's continuous-time TD fixed point E[phi*delta]=0 directly by
  # least squares (theta = -(M + reg*I)^-1 b), stable where semi-gradient TD diverges
  # (deadly triad with high-dim correlated signature features on multi-D state) and
  # free of the projected-fixed-point bias (methodology 7.1). Accumulates M,b over
  # transitions with exponential forgetting across episodes, re-solving each episode end.
  lstd: false             # true: use LSTD instead of semi-gradient TD for the critic
  lstd_reg: 1.0e-3        # Tikhonov regularisation on the LSTD system (M + reg*I)
  lstd_forget: 0.7        # exponential forgetting of M,b across episodes (1.0 = full growing batch)
  lstd_rank: 0            # >0: truncated-SVD LSTD in the top-k PC subspace of the centred
                          # feature covariance (cures rank-deficiency for high-dim signatures)
