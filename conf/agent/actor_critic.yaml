# ContinuousTimeActorCritic Agent Configuration
# Continuous-Time Actor-Critic with Path Signatures for Delayed Systems

_target_: src.agents.actor_critic_jax.ContinuousTimeActorCritic

# =============================================================================
# Training (optimization, episodes, logging)
# =============================================================================
training:
  n_episodes: 1000   # uniform training duration across AC/PG/VG (PG inherits this; VG set to match)
  max_time: 15.0
  actor_lr: 1e-3
  # Matched to conf/agent/value_gradient.yaml (1e-3). Both learners fit a critic to the same
  # object -- the value functional V -- through a continuous-time temporal-difference residual, so
  # a learning rate ten times larger here made the critic update the one thing that differed
  # between the agents besides the learning rule itself. Neither value was ever tuned: `git log -S
  # critic_lr` returns a single commit for each config, a02cc92 ("initial: extract RL as standalone
  # rep"), so both are inherited defaults and matching them discards no tuning. actor_lr is NOT
  # matched and cannot be: the value gradient has no actor, extracting its control analytically
  # from the critic's vertical derivative instead.
  critic_lr: 1e-3
  optimizer: adam           # 'adam' (RM-scheduled diagonal preconditioner) or 'sgd' (plain continuous-time gradient, Doya 2000)
  actor_optimizer: null     # per-role override; null -> use `optimizer`. Actor is a TRUE gradient (Adam applies)
  critic_optimizer: null    # per-role override; null -> use `optimizer`. Critic is semi-gradient TD ('sgd' = classical RM-TD)
  scale: 1.0
  clip_gradient: null   # opt-in global-norm clipping; null = no clipping (default)
  # null/<=0: no action clipping. Matched to conf/agent/value_gradient.yaml:14 so that both
  # learners apply the SAME rule to the control. The array does not override clip_action, so the
  # previous 10.0 made this agent the only one clipping. Measured at seed 0 over 20 episodes: the
  # bound never binds on linear_dde / hopfield_linear / hopfield_nonlinear (max |u| 0.36-0.44) nor
  # on the markovian/signature arms of the markovian double-integrator control cell (config since
  # removed) (max |u| 0.35), but binds on 152/2973 = 5.113% of steps on its raw_history arm, whose
  # pre-clip |u| reaches 2014.44. That is ONE ARM of
  # the H1 contrast on the falsification control cell, so the clamp acted on the comparison rather
  # than on both sides of it. Setting null is bit-inert wherever it did not bind.
  clip_action: null
  # Episode is cut when ||x|| exceeds this bound. Aligned with the value gradient's
  # conf/agent/value_gradient.yaml (100.0): the previous 50.0 made this agent the outlier and
  # terminated episodes on state excursions the value gradient was allowed to complete, which is a
  # confound in any actor-critic-versus-value-gradient comparison at fixed representation.
  # The bound is INERT with respect to the state scaling only while network.normalize_entries is
  # false: actor_critic_jax.py:93 sets training.scale = training.divergence_threshold when
  # normalize_entries is true, so a study enabling that flag changes its normalisation constant
  # from 50 to 100 along with this value.
  # null/<=0: NO trimming, matched to conf/agent/value_gradient.yaml. See the note there.
  #
  # This agent additionally had NO finiteness guard at all until 2026-07-17, and `nan > threshold`
  # is False, so a NaN state tripped neither the bound nor anything else and the episode simply
  # ran on. That is the measured mechanism by which this agent's evaluation on
  # MG_1D_chaotic/raw_history reached ||x|| = 3.37e28 and returned nan whilst the value gradient,
  # on the identical cell/representation/seed, stayed finite. The guard now added to
  # _is_episode_done catches it and says so.
  divergence_threshold: null
  eval_interval: 20
  eval_start_episode: 0
  patience: 0
  log_interval: 1
  init_log_interval: 50
  memory_clear_interval: 200000
  discretization_state: 0.01
  # Robbins-Monro actor learning-rate decay alpha_k = actor_lr/(1+k)^p, k the episode index (the
  # averaged actor steps once per episode). p=0.6 is just above the RM boundary 1/2, i.e. close to
  # the largest-step admissible schedule. Inherited by conf/agent/policy_gradient.yaml. alpha_0
  # (actor_lr) to be confirmed by the seed-42 controllability sweep. Constant (0) would converge
  # only to a noise ball.
  lr_decay_power: 0.8       # ACTOR RM, two-timescale: decays FASTER than the critic (0.6) so the actor is the slow timescale
  critic_lr_decay_power: 0.6  # CRITIC RM (fast timescale); value-function stochastic approximation
  # Critic warm-up: freeze the actor for the first N episodes while the critic learns V per step
  # (targets the cold-critic early transient; see src/configs.py::TrainingConfig). 0 = disabled.
  # Stated explicitly rather than left to the dataclass default, so the saved config is unambiguous.
  actor_warmup_episodes: 0
  # Batch K independent rollouts per actor update (raises the averaged-update SNR ~K at the same
  # total episode budget; see src/configs.py::TrainingConfig). 1 = one update per episode.
  rollouts_per_update: 1
  # Per-episode actor-signal diagnostics (update-SNR, advantage-noise coupling, adv mean/std, N_eff,
  # grad signal). Off by default -- computing the T per-step gradients is ~T extra backprops; the
  # signal studies override this to true. Explicit here so the base config carries no hidden default.
  monitor_snr: false

# =============================================================================
# Discount (Doya continuous-time discounting)
# =============================================================================
discount:
  # Infinite-horizon DISCOUNTED, matching the paper (AnonymousSubmission2027.tex l.372):
  # V^u(x(t)) = int_t^inf e^{-gamma(s-t)} r ds, with the stationary discounted HJB gamma V = sup_u{...}.
  # The TD error becomes delta = r + Vdot - gamma V (code: r + Vdot - V/tau), so gamma = 1/tau.
  # discounted was 'false' only as the inherited dataclass default (initial commit a02cc92), never
  # reconciled with the paper -- undiscounted hands the STATIONARY critic V_theta(x) a non-stationary
  # (finite T) or unbounded (non-regulating policy) target, which is ill-posed. Discounting gives a
  # bounded, stationary target -x'P_gamma x (shifted Riccati A -> A - gamma/2 I) and a soft horizon
  # ~1/gamma, so episodes truncate at T ~ 3-5 tau.
  discounted: true
  tau: 2.0                 # gamma = 1/tau = 0.5 (effective horizon ~2; use T = 5*tau = 10)
  V_target: 0.0
  V_bad: -10.0

# =============================================================================
# Noise (exploration)
# =============================================================================
noise:
  sigma: 0.5   # exploration OU noise (uniform across AC/PG/VG)
  schedule: constant      # 'constant', 'linear_decay', 'adaptive'
  decay: false
  smooth: true            # GP-sampled smooth noise
  # Matched to conf/agent/value_gradient.yaml (0.002). The difference was INERT rather than a
  # confound, and the measurement is worth recording: the kernel built at
  # value_gradient_jax.py:425 is k(t,t') = exp(-(t-t')^2 / (2 l^2)) on a grid of spacing dt, so the
  # correlation between adjacent control steps is exp(-dt^2 / (2 l^2)). At dt = 0.1 that is 0.000
  # for l = 0.002 and 3.7e-06 for l = 0.02: BOTH covariance matrices are numerically the identity,
  # so both agents already drew WHITE noise and `smooth: true` bought nothing but a Cholesky
  # factorisation per episode. Matching removes the appearance of a difference, not a real one.
  #
  # NOTE, deliberately not acted upon here: this is a fidelity gap against Doya (2000), whose
  # exploration is LOW-PASS FILTERED (Ornstein-Uhlenbeck, tau_n = 1.0) and therefore strongly
  # correlated in time. src/configs.py:66 defaults length_scale to 0.2, which WOULD deliver
  # correlated noise (0.883 at dt = 0.1); both shipped configs override that default with values
  # that destroy the correlation. Restoring it would change the value gradient and hence the
  # existing five-seed results, so it is recorded rather than applied.
  length_scale: 0.002
  ou: true                 # Ornstein-Uhlenbeck exploration (Doya 2000), dt-independent correlation exp(-dt/tau_n); overrides the white GP path
  tau_n: 1.0

# =============================================================================
# Signature (path signature architecture)
# =============================================================================
signature:
  kind: signature       # representation: signature | raw_history | markovian
  actor_feature_map: raw  # 'raw': strip the poly lift -> actor eats raw state (markovian) / raw path (raw_history) / the signature (signature); 'same': actor reuses the critic map
  depth: 2              # signature truncation depth (kind=signature); matched to value_gradient.yaml (was 3 -> confound: AC ran depth-3 signatures vs VG depth-2)
  degree: 2             # polynomial degree (kind=raw_history / markovian)
  window_size: 40
  time_augmentation: true
  origin_augmentation: true
  state_augmentation: false
  bias: false
  force_signature_window: false  # if true, override window_size to match max delay

# =============================================================================
# Network (neural network setup)
# =============================================================================
network:
  std_init: 0.01
  normalize_entries: false
  normalize_sigs: false

# =============================================================================
# Algorithm (variant flags)
# =============================================================================
algorithm:
  semi_gradient: true
  integral_td: false
  actor_oracle: false
  critic_oracle: false
  actor_update_frequency: 10   # ignored when actor_averaged is true
  # Accumulate the per-step actor gradient over the episode and apply ONE averaged step, matching
  # the policy gradient's once-per-episode cadence (variance ~1/T lower than the online single-
  # sample step; makes AC-vs-PG a clean one-variable contrast, TD error vs return). See
  # AlgorithmConfig.actor_averaged.
  actor_averaged: true
  # The initial condition of a delay differential equation is the initial PATH phi on [-tau, 0],
  # loaded directly into the representation window from the env history buffer by
  # _fill_buffer_initial. Control therefore begins at t=0 from phi, and there is NO zero-control
  # burn-in: a burn-in would replace phi by the uncontrolled evolution and, the episode clock not
  # being re-based, would be charged to the episode horizon.
  preheat: false
  burning_steps: 0
  fix_initial_state: true
